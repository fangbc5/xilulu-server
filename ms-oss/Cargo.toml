[package]
name = "ms-oss"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
fbc-starter = { workspace = true, features = ["mysql", "redis", "nacos", "producer", "consumer", "openapi"] }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
sqlx = { workspace = true }
sqlxplus = { workspace = true }

# Redis 缓存（与 fbc-starter 保持同版本）
deadpool-redis = { workspace = true }

# S3 兼容 SDK（轻量级 rust-s3，替代 aws-sdk-s3）
rust-s3 = { workspace = true }
http = "1"

# 加密与哈希（用于签名和校验）
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = "0.22"

# JWT 长效分享链接
jsonwebtoken = "9"
urlencoding.workspace = true

# OpenAPI 文档
utoipa = { workspace = true, features = ["uuid"] }
utoipa-swagger-ui = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tower = { workspace = true, features = ["util"] }
axum = { workspace = true, features = ["macros"] }
http-body-util = { workspace = true }
hyper = { version = "1", features = ["full"] }

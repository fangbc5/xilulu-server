# ms-oss 一键部署（仅服务本身）
# Redis / Nacos / MySQL / RustFS 请复用 fbc-starter/docker 中的服务。
#
# 使用方式（在 ms-oss 目录下）:
#   docker compose up -d --build

services:
  ms-oss:
    build:
      # 在 workspace 根目录构建，保证能找到 workspace Cargo.toml
      context: ..
      dockerfile: ms-oss/Dockerfile
    image: ms-oss:latest
    container_name: ms-oss
    ports:
      - "30003:30003"
    env_file:
      - .env.docker
    restart: unless-stopped
    networks:
      - fbc-network

networks:
  fbc-network:
    external: true

# ms-identity 一键部署（仅服务本身）
# Redis / Nacos / MySQL 请复用 fbc-starter/docker 中的服务。
#
# 使用方式（在 ms-identity 目录下）:
#   docker compose up -d --build

services:
  ms-identity:
    build:
      context: ..
      dockerfile: ms-identity/Dockerfile
    image: ms-identity:latest
    container_name: ms-identity
    ports:
      - "30001:30001"
    env_file:
      - .env.docker
    restart: unless-stopped
    networks:
      - fbc-network

networks:
  fbc-network:
    external: true

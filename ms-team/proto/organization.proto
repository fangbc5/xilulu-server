syntax = "proto3";

package organization;

// 组织架构服务
service OrganizationService {
  // 根据用户ID获取员工信息（指定组织）
  rpc GetEmployeeByUserId(GetEmployeeByUserIdRequest) returns (EmployeeResponse);
  
  // 获取用户在租户下的所有员工身份
  rpc GetEmployeesByUserId(GetEmployeesByUserIdRequest) returns (EmployeesResponse);
  
  // 获取员工的部门列表
  rpc GetEmployeeDepartments(GetEmployeeDepartmentsRequest) returns (DepartmentsResponse);
  
  // 获取部门下的所有员工
  rpc GetDepartmentEmployees(GetDepartmentEmployeesRequest) returns (EmployeesResponse);
  
  // 获取部门树
  rpc GetDepartmentTree(GetDepartmentTreeRequest) returns (DepartmentTreeResponse);
  
  // 检查用户是否是部门负责人
  rpc CheckDepartmentLeader(CheckDepartmentLeaderRequest) returns (BoolResponse);
  
  // 获取用户的数据权限范围（部门ID列表）
  rpc GetUserDataScope(GetUserDataScopeRequest) returns (DataScopeResponse);
}

// 根据用户ID获取员工请求
message GetEmployeeByUserIdRequest {
  int64 user_id = 1;
  int64 tenant_id = 2;
  int64 org_id = 3;  // 可选，不传则返回默认组织的员工
}

// 获取用户所有员工身份请求
message GetEmployeesByUserIdRequest {
  int64 user_id = 1;
  int64 tenant_id = 2;
}

// 获取员工部门请求
message GetEmployeeDepartmentsRequest {
  int64 employee_id = 1;
}

// 获取部门员工请求
message GetDepartmentEmployeesRequest {
  int64 department_id = 1;
  bool include_children = 2;  // 是否包含子部门员工
}

// 获取部门树请求
message GetDepartmentTreeRequest {
  int64 tenant_id = 1;
  int64 org_id = 2;
  int64 parent_id = 3;  // 可选，不传则从根部门开始
}

// 检查部门负责人请求
message CheckDepartmentLeaderRequest {
  int64 user_id = 1;
  int64 department_id = 2;
}

// 获取用户数据权限范围请求
message GetUserDataScopeRequest {
  int64 user_id = 1;
  int64 tenant_id = 2;
  int64 org_id = 3;
}

// 员工响应
message EmployeeResponse {
  bool success = 1;
  string message = 2;
  Employee employee = 3;
}

// 员工列表响应
message EmployeesResponse {
  bool success = 1;
  string message = 2;
  repeated Employee employees = 3;
}

// 部门列表响应
message DepartmentsResponse {
  bool success = 1;
  string message = 2;
  repeated Department departments = 3;
}

// 部门树响应
message DepartmentTreeResponse {
  bool success = 1;
  string message = 2;
  repeated DepartmentNode nodes = 3;
}

// 布尔响应
message BoolResponse {
  bool success = 1;
  string message = 2;
  bool result = 3;
}

// 数据权限范围响应
message DataScopeResponse {
  bool success = 1;
  string message = 2;
  int32 scope_type = 3;  // 1-全部 2-本组织 3-本部门及下级 4-本部门 5-仅本人 6-自定义
  repeated int64 department_ids = 4;  // 自定义时的部门ID列表
}

// 员工信息
message Employee {
  int64 id = 1;
  int64 tenant_id = 2;
  int64 org_id = 3;
  int64 user_id = 4;
  string employee_no = 5;
  string name = 6;
  string avatar = 7;
  int32 gender = 8;
  string mobile = 9;
  string email = 10;
  int32 status = 11;
  Department primary_department = 12;
  Position primary_position = 13;
}

// 部门信息
message Department {
  int64 id = 1;
  int64 tenant_id = 2;
  int64 org_id = 3;
  int64 parent_id = 4;
  string code = 5;
  string name = 6;
  string full_name = 7;
  string path = 8;
  int32 level = 9;
  int64 leader_employee_id = 10;
  int32 sort_order = 11;
  int32 status = 12;
}

// 部门树节点
message DepartmentNode {
  Department department = 1;
  repeated DepartmentNode children = 2;
}

// 岗位信息
message Position {
  int64 id = 1;
  int64 tenant_id = 2;
  int64 org_id = 3;
  string code = 4;
  string name = 5;
  string category = 6;
  int32 level = 7;
  int32 sort_order = 8;
  int32 status = 9;
}

// 组织信息
message Organization {
  int64 id = 1;
  int64 tenant_id = 2;
  int64 parent_id = 3;
  string code = 4;
  string name = 5;
  string short_name = 6;
  int32 type = 7;
  string logo = 8;
  int32 sort_order = 9;
  int32 status = 10;
}

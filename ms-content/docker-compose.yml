# ms-content 一键部署（仅服务本身）
# MySQL / Redis / Nacos / Meilisearch 请复用 fbc-starter/docker 中的服务。
#
# 使用方式（在 ms-content 目录下）:
#   docker compose up -d --build

services:
  ms-content:
    build:
      # 在 workspace 根目录构建，保证能找到 workspace Cargo.toml
      context: ..
      dockerfile: ms-content/Dockerfile
    image: ms-content:latest
    container_name: ms-content
    ports:
      - "30106:30106"
    env_file:
      - .env.docker
    restart: unless-stopped
    networks:
      - fbc-network

networks:
  fbc-network:
    external: true

## rnacos 一键部署（轻量级 Nacos 实现）
##
## 在 docker 目录下执行：
##   docker compose -f docker-compose-rnacos.yml up -d
## 停止：
##   docker compose -f docker-compose-rnacos.yml down
## 删除数据卷：
##   docker compose -f docker-compose-rnacos.yml down -v

services:
  rnacos:
    image: qingpan/rnacos:v0.7.9-alpine
    container_name: fbc-rnacos
    ports:
      - "${RNACOS_HTTP_PORT:-8848}:8848"
      - "${RNACOS_GRPC_PORT:-9848}:9848"
      - "${RNACOS_CLUSTER_PORT:-10848}:10848"
    environment:
      RNACOS_HTTP_PORT: 8848
      RNACOS_GRPC_PORT: 9848
      RNACOS_RUN_IN_DOCKER: "true"
      RUST_LOG: "${RNACOS_LOG_LEVEL:-info}"
      RNACOS_CONFIG_DB_DIR: /io/nacos_db
    volumes:
      - rnacos_data:/io
    restart: unless-stopped

volumes:
  rnacos_data:


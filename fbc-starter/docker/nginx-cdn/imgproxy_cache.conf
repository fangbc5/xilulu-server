proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=img_cache:10m max_size=10g inactive=7d use_temp_path=off;

# Docker 内部 DNS 解析器（变量 proxy_pass 必须配置 resolver）
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name localhost;

    # ============================================
    # OSS 请求入口 — Lua 动态路由
    # ============================================
    # Lua 在 access 阶段决定 $oss_target 的值：
    #   - image 请求 → http://imgproxy:8080/{签名}/{处理}/{source}
    #   - 其他请求   → http://host.docker.internal:30003/oss/{bucket}/{key}?原始参数
    # proxy_pass 使用变量，运行时才解析目标地址
    location ~ ^/oss/(?<oss_bucket>[^/]+)/(?<oss_key>.*)$ {
        set $oss_target "";

        access_by_lua_file /etc/nginx/lua/oss_parser.lua;

        proxy_pass $oss_target;

        # 缓存设定
        proxy_cache img_cache;
        proxy_cache_valid 200 7d;
        proxy_cache_valid 301 302 1d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header Cache-Control;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        add_header Cache-Control "public, max-age=604800";
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
    }

    # ============================================
    # 兼容直接访问 imgproxy 的旧请求
    # ============================================
    location / {
        proxy_pass http://imgproxy:8080;

        proxy_cache img_cache;
        proxy_cache_valid 200 7d;
        proxy_cache_valid 301 302 1d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header Cache-Control;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        add_header Cache-Control "public, max-age=604800";
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
    }
}
